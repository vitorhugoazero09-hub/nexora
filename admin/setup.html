
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração inicial | NEXORA</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: #141414;
      border: 1px solid #b89545;
      border-radius: 14px;
    }

    h1 { color: #d6b45c; margin-top: 0; }
    p { color: #aaa; line-height: 1.5; }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 7px;
      font-size: 15px;
    }

    input {
      background: #080808;
      border: 1px solid #444;
      color: white;
    }

    button {
      border: 0;
      background: #c5a34e;
      color: #080808;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>NEXORA</h1>
    <p>Configuração do primeiro administrador.</p>

    <form id="setupForm">
      <input type="email" id="email"
        placeholder="Seu e-mail" required>

      <input type="password" id="password"
        placeholder="Crie uma senha (mínimo 12 caracteres)"
        minlength="12" maxlength="128" required>

      <input type="password" id="setupSecret"
        placeholder="Chave de configuração" required>

      <button type="submit">Criar administrador</button>
    </form>

    <p id="message"></p>
  </main>

  <script>
    const form = document.getElementById("setupForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Criando administrador...";

      try {
        const response = await fetch("/api/admin/setup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            setup_secret: document.getElementById("setupSecret").value
          })
        });

        const result = await response.json();
        message.textContent =
          result.message || result.error || "Ocorreu um erro.";

        if (response.ok) form.reset();

      } catch (error) {
        message.textContent =
          "Não foi possível conectar ao servidor.";
      }
    });
  </script>
</body>
</html>
