
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo | NEXORA</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#f5f5f5;font-family:Arial,sans-serif}
header{padding:22px 6%;background:#141416;border-bottom:1px solid #292929;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#d8b45a}
button{border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:bold}
.logout{background:#292929;color:white}
main{max-width:1100px;margin:35px auto;padding:0 20px}
h1{margin-bottom:8px}
.muted{color:#aaa}
.card{background:#151517;border:1px solid #292929;border-radius:13px;padding:22px;margin-top:25px}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
input,textarea,select{width:100%;padding:13px;background:#222;color:white;border:1px solid #383838;border-radius:8px;font-size:14px}
textarea{grid-column:1/-1;min-height:85px;resize:vertical}
.full{grid-column:1/-1}
.primary{background:#d8b45a;color:#17130a}
.product{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:17px 0;border-bottom:1px solid #303030}
.product:last-child{border:0}
.product-info{min-width:0}
.product-info strong{display:block;margin-bottom:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.edit{background:#343434;color:white}
.delete{background:#642e2e;color:white}
.status{font-size:12px;color:#d8b45a}
#message{margin-top:15px;color:#d8b45a}
@media(max-width:650px){
form{grid-template-columns:1fr}
textarea,.full{grid-column:1}
.product{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>

<header>
  <div class="logo">NEXORA</div>
  <button class="logout" id="logout">Sair</button>
</header>

<main>
  <h1>Painel administrativo</h1>
  <p class="muted">Gerencie os produtos da sua loja digital.</p>

  <section class="card">
    <h2 id="formTitle">Cadastrar novo e-book</h2>
    <form id="productForm">
      <input id="title" placeholder="Nome do e-book" required>
      <input id="category" placeholder="Categoria" required>
      <input id="price" type="number" min="0" step="0.01" placeholder="Preço (R$)" required>
      <input id="cover" placeholder="URL da capa">
      <input id="checkout" class="full" placeholder="Link de checkout">
      <textarea id="description" placeholder="Descrição do e-book"></textarea>
      <button class="primary full" type="submit" id="saveButton">Cadastrar produto</button>
      <button class="edit full" type="button" id="cancelEdit" hidden>Cancelar edição</button>
    </form>
    <div id="message"></div>
  </section>

  <section class="card">
    <h2>Produtos cadastrados</h2>
    <p class="muted" id="count">Carregando produtos...</p>
    <div id="products"></div>
  </section>
</main>

<script>
const api = "/api/admin/products";
let editingId = null;
let productCache = [];

const $ = id => document.getElementById(id);

async function request(url, options = {}) {
  const response = await fetch(url, {
    credentials: "same-origin",
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  const data = await response.json().catch(() => ({}));

  if (response.status === 401) {
    location.href = "/admin/login.html";
    throw new Error("Sessão expirada.");
  }

  if (!response.ok || data.success === false) {
    throw new Error(data.error || "Não foi possível concluir a operação.");
  }

  return data;
}

async function checkLogin() {
  await request("/api/admin/me");
}

async function loadProducts() {
  try {
    const data = await request(api);
    productCache = data.products || [];
    $("count").textContent = productCache.length + " produto(s) cadastrado(s)";
    renderProducts();
  } catch (error) {
    $("count").textContent = error.message;
  }
}

function renderProducts() {
  const container = $("products");
  container.innerHTML = "";

  if (!productCache.length) {
    container.textContent = "Nenhum produto cadastrado ainda.";
    return;
  }

  productCache.forEach(product => {
    const item = document.createElement("div");
    item.className = "product";

    const info = document.createElement("div");
    info.className = "product-info";

    const name = document.createElement("strong");
    name.textContent = product.title;

    const details = document.createElement("span");
    details.className = "muted";
    details.textContent =
      product.category + " • R$ " +
      Number(product.price).toFixed(2).replace(".", ",");

    const status = document.createElement("div");
    status.className = "status";
    status.textContent = Number(product.active) === 1 ? "Ativo" : "Inativo";

    info.append(name, details, status);

    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.className = "edit";
    edit.textContent = "Editar";
    edit.onclick = () => editProduct(product.id);

    const toggle = document.createElement("button");
    toggle.className = "edit";
    toggle.textContent = Number(product.active) === 1 ? "Desativar" : "Ativar";
    toggle.onclick = () => toggleProduct(product.id);

    const remove = document.createElement("button");
    remove.className = "delete";
    remove.textContent = "Excluir";
    remove.onclick = () => deleteProduct(product.id);

    actions.append(edit, toggle, remove);
    item.append(info, actions);
    container.append(item);
  });
}

function resetForm() {
  editingId = null;
  $("productForm").reset();
  $("formTitle").textContent = "Cadastrar novo e-book";
  $("saveButton").textContent = "Cadastrar produto";
  $("cancelEdit").hidden = true;
}

function editProduct(id) {
  const product = productCache.find(p => Number(p.id) === Number(id));
  if (!product) return;

  editingId = Number(id);
  $("title").value = product.title || "";
  $("category").value = product.category || "";
  $("price").value = product.price;
  $("cover").value = product.cover || "";
  $("checkout").value = product.checkout_url || "";
  $("description").value = product.description || "";

  $("formTitle").textContent = "Editar e-book";
  $("saveButton").textContent = "Salvar alterações";
  $("cancelEdit").hidden = false;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function toggleProduct(id) {
  const product = productCache.find(p => Number(p.id) === Number(id));
  if (!product) return;

  try {
    await request(api, {
      method: "PUT",
      body: JSON.stringify({
        ...product,
        id: Number(id),
        active: Number(product.active) === 1 ? 0 : 1
      })
    });
    await loadProducts();
  } catch (error) {
    alert(error.message);
  }
}

async function deleteProduct(id) {
  if (!confirm("Tem certeza que deseja excluir este produto?")) return;

  try {
    await request(api, {
      method: "DELETE",
      body: JSON.stringify({ id: Number(id) })
    });
    await loadProducts();
  } catch (error) {
    alert(error.message);
  }
}

$("productForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("message").textContent = "Salvando...";

  const product = {
    title: $("title").value.trim(),
    category: $("category").value.trim(),
    price: Number($("price").value),
    cover: $("cover").value.trim(),
    checkout_url: $("checkout").value.trim(),
    description: $("description").value.trim()
  };

  try {
    await request(api, {
      method: editingId ? "PUT" : "POST",
      body: JSON.stringify(editingId ? { ...product, id: editingId } : product)
    });

    $("message").textContent = "Produto salvo com sucesso!";
    resetForm();
    await loadProducts();
  } catch (error) {
    $("message").textContent = error.message;
  }
});

$("cancelEdit").onclick = resetForm;

$("logout").onclick = () => {
  alert("Para sair, feche esta sessão no navegador. O encerramento da sessão será implementado na próxima etapa.");
};

(async () => {
  try {
    await checkLogin();
    await loadProducts();
  } catch (error) {
    if (error.message !== "Sessão expirada.") {
      $("count").textContent = "Não foi possível verificar sua sessão.";
    }
  }
})();
</script>

</body>
</html>
